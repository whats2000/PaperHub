# H4 merge-gate scenario cases (SRS §III-10.4): 8 multi-turn R&D scenarios
# x 3 cases, plus 6 simple turns timed by the latency gate (G-d).
#
# Every paper below is in the user's library (same paper_content ids and
# chunk ids in the H4 copy and the v2.41.0 eval copy). Chunk ids quoted in
# seeded assistant turns are real ids from those papers.
#
# Run (from backend/), H4 = candidate, v2.41.0 = baseline:
#   scripts/run-benchmark.ps1 -Config benchmark/cases.h4-scenarios.toml -Judge `
#     -BaseUrl http://127.0.0.1:8100 -DbPath D:/paperhub-h4-workspace/paperhub.db `
#     -Compare http://127.0.0.1:8200 -CompareDbPath D:/paperhub-v241-eval-workspace/paperhub.db
#
# Scenarios 4 and 5 are H4-only in the gate: they count toward G-a but are
# left out of the pairwise comparison (G-b). v2.41.0 still runs them; its
# answers are recorded for reference.
#
# The scenario-5 cases MUTATE the library: they add Switch Transformers, MAE
# and QLoRA to whichever copy runs them. On a re-run (or after an earlier
# run) those papers are already present, so their rubrics also accept the
# agent reporting "already in the library" without adding a duplicate.
#
# The G-d simple turns come first, so the library-count answers are read
# before any scenario-5 case adds a paper to the H4 copy.

[benchmark]
name = "h4-scenarios"
suite = "scenarios"
base_url = "http://127.0.0.1:8100"
db_path = "D:/paperhub-h4-workspace/paperhub.db"

[papersets]
gisc_yoloseg = [
  "sha256:b973a48f4b473829bb30671bec295b5682f1ec9509748ad02576eb16a5c1a6f4",  # YOLOSeg (wafer die defects)
  "sha256:471e47c7589a69ec5c096cc38e3ce9ddcf9e69a10def7e3f0a7c46dca6506699",  # Review of Ghost Imaging via Sparsity Constraints
]
yoloseg = [
  "sha256:b973a48f4b473829bb30671bec295b5682f1ec9509748ad02576eb16a5c1a6f4",
]
livecell = [
  "sha256:ade2a8b1d411f0fd0f98e33e582591df4ac9e62f37abadd823858a8071a2f8b4",  # LIVECell
]
collapse = [
  "sha256:a461808d21b1715a74306506433662b1ad275f07340db54348138810c341a832",  # AI models collapse
]
moe3 = [
  "arxiv:2202.09368",   # Expert Choice Routing
  "arxiv:2408.15664",   # Auxiliary-Loss-Free Load Balancing
  "arxiv:2412.14711",   # ReMoE
]
jepa = [
  "arxiv:2301.08243",   # I-JEPA
  "arxiv:2404.08471",   # V-JEPA
]
vla2 = [
  "arxiv:2503.14734",   # GR00T N1
  "arxiv:2510.10274",   # X-VLA
]

# ---------------------------------------------------------------------------
# G-d simple turns (no scenario number: timed by G-d, not counted by G-a)
# ---------------------------------------------------------------------------

[[cases]]
id = "gd-chat-01-thanks"
kind = "chitchat"
prompt = "Hi! Thanks for the help yesterday."
rubric = "A short, friendly reply. No claims about papers, no citations needed, no actions taken."

[[cases]]
id = "gd-chat-02-capabilities"
kind = "chitchat"
prompt = "What kinds of things can you help me with here?"
rubric = "A short overview of what the assistant can do (read and cite papers in the library, compare them, search for and add papers, answer library questions, make slides, remember preferences). No invented paper content."

[[cases]]
id = "gd-chat-03-morning-zh"
kind = "chitchat"
prompt = "早安！"
rubric = "A short friendly greeting, in Chinese (the user wrote Chinese). No paper claims, no actions."

[[cases]]
id = "gd-lib-01-total"
kind = "library_count"
prompt = "How many papers are in my library?"
rubric = "States the library's paper count: 62 (56 arXiv papers + 6 PDF uploads) when this suite first ran. The scenario-5 cases add papers to the H4 copy, so on a re-run a higher count is correct when it matches the library at that moment (the trace's query_library result shows it). A count that matches neither is wrong."

[[cases]]
id = "gd-lib-02-year-2025"
kind = "library_count"
prompt = "How many papers in my library were published in 2025?"
rubric = "21 papers (paper_content.year = 2025). Listing them is optional."

[[cases]]
id = "gd-lib-03-uploads"
kind = "library_count"
prompt = "How many of my library papers are PDF uploads rather than arXiv papers?"
rubric = "6 PDF uploads (vs 56 arXiv papers). One of the six is marked private; mentioning that is optional. Naming the uploads is optional."

# ---------------------------------------------------------------------------
# Scenario 1 — follow-ups on the thread
# ---------------------------------------------------------------------------

[[cases]]
id = "s1-01-run892"
scenario = 1
paperset = "gisc_yoloseg"
prompt = '''給我更詳細實驗方法'''
rubric = "Run 892's turn. The user asks for a more detailed EXPERIMENT METHOD for the idea under discussion: porting GISC's sparsity-constrained optimisation (data-fidelity term + sparsity regulariser, min mu1 f1{Y-AO} + mu2 f2{O}) into YOLOSeg for small low-contrast wafer-die defects. A correct answer designs how to test THAT port, e.g. where the sparsity term enters YOLOSeg (an L1 / sparsity regulariser on the mask or features added to its loss), the baseline (YOLOSeg's own setup: freeze detection then train segmentation, bce-dice mask loss, DDPM augmentation), the data (549 defective images split 90/10, 275 test images, 1232x972), the metrics YOLOSeg uses (AP@IoU=0.5 and IoU) and ablations (regulariser weight, with/without). Paper facts must be cited from the two papers' chunks. FAILS on_thread if it just describes each paper's own method separately (the run-892 bug). Answer in Traditional Chinese."
turns = [
  { user = '''我們來深入討論這個 idea：「Sparsity constraints for low-contrast segmentation」。
機制來源：「A Review of Ghost Imaging via Sparsity Constraints」的 2. Theoretical Framework of GISC 段落。
應用目標：「YOLOSeg with applications to wafer die particle defect segmentation」的 Image dataset 段落。
為什麼可能搭得上：The target segmentation method struggles to isolate exceptionally small, low-contrast anomalies from dense background grids. Treating the low-contrast defect as a regularized optimization problem guided by sparsity constraints would mathematically isolate these subtle variations from the overriding background pattern.
這個機制要怎麼移植過去？類比可能在哪裡不成立？''', assistant = '''這個將「稀疏性約束（Sparsity constraints）」引入「低對比度分割（Low-contrast segmentation）」的 idea 非常具備啟發性。我們結合這兩篇論文的內容，來探討如何移植此機制，以及類比可能面臨的挑戰。

### 機制如何移植（How to Port the Mechanism）

根據《A Review of Ghost Imaging via Sparsity Constraints》，鬼成像（Ghost Imaging, GI）的影像重建核心在於將其表述為一個最佳化問題：結合「數據保真項（data fidelity term）」與基於目標先驗資訊的「正則化項（regularization term）」（通常表現為稀疏性約束），透過求解例如 $\min \mu_1 f_1\{Y - AO\} + \mu_2 f_2\{O\}$ 的數學模型來濾除雜訊並重建微弱信號 [chunk:86149] (p.1)。

在《YOLOSeg with applications to wafer die particle defect segmentation》中，晶圓晶粒（wafer die）的粒子缺陷具有兩個極端特徵：尺寸極小（佔全圖不到 0.02%）且與背景對比度極低（low contrast），其色調與晶圓表面高度相似 [chunk:82421]。

**移植策略：**
這兩者在數學結構上高度契合。我們可以將晶圓上重複且密集的背景網格視為「基底分量（或雜訊）」，而將微小且罕見的缺陷視為「稀疏信號」。在 YOLOSeg 這樣的深度學習模型訓練中，可以借鑒上述的稀疏約束優化框架 [chunk:86149] (p.1)，將稀疏性正則化（例如 $L_1$ 範數或基於壓縮感知/字典學習的損失項）整合進神經網路的損失函數（Loss function）中。這種數學約束能強制模型在特徵提取時，主動抑制大面積的平坦與重複背景紋理，從而將極小且低對比度的缺陷特徵從背景中「數學性地剝離」出來 [chunk:82421, 86149] (p.1)。

### 類比可能不成立或面臨挑戰之處（Where the Analogy Might Break Down）

儘管概念上相符，但在物理機制與算法架構的對接上，此類比可能在以下幾個層面不成立：

1. **測量矩陣的物理基礎差異（Physical Measurement Matrix vs. Standard Images）：**
   * 在《A Review of Ghost Imaging via Sparsity Constraints》中，優化模型 $\min \{Y - AO\}$ 裡的 $Y$ 來自測試臂（test arm）的實際強度波動測量，而測量矩陣 $A$ 則是由參考臂（reference arm）已知的光場強度分佈所構成，具有明確的物理光學基礎 [chunk:86149] (p.1)。
   * 然而，在《YOLOSeg with applications to wafer die particle defect segmentation》中，影像資料是標準的單一光學圖像，不存在雙臂物理抽樣機制與測量矩陣 [chunk:82421]。若要套用此機制，必須人為構造測量矩陣（例如透過卷積操作或字典學習來模擬），這會失去 GI 原本基於物理光學抽樣的優勢。

2. **背景並非純粹的隨機雜訊（Complex vs. Random Backgrounds）：**
   * 鬼成像的稀疏約束通常建立在已知統計特性的光場散斑（speckle patterns）或均勻隨機背景上 [chunk:86149] (p.1)。
   * 晶圓表面背景並非單純的均勻雜訊。《YOLOSeg with applications to wafer die particle defect segmentation》指出，晶圓的 pad 區域周圍存在許多「類似斑點的圖案（spot-like patterns）」，這些合法結構在視覺上極難與真實粒子缺陷區分 [chunk:82421]。若強行對整張影像施加全域稀疏性約束，模型可能會將正常的電路特徵誤判為雜訊而過度平滑，或將 pad 區的斑點錯誤地放大為稀疏缺陷。

3. **優化框架的衝突（Iterative Optimization vs. End-to-End Deep Learning）：**
   * GISC 使用的是基於壓縮感知（Compressive Sensing）等傳統數學優化理論，透過迭代求解極小值 [chunk:86149] (p.1)。
   * 根據《YOLOSeg with applications to wafer die particle defect segmentation》的架構描述，YOLOSeg 是基於 YOLOv5s 的深度卷積神經網路 [chunk:82414]。將嚴格的數學迭代稀疏求解器直接嵌入端到端（End-to-End）的神經網路中，可能會與基於梯度下降的反向傳播機制產生衝突，導致模型訓練不穩定或難以收斂。''' },
]

[[cases]]
id = "s1-02-remoe-sparsity"
scenario = 1
paperset = "moe3"
prompt = "OK, but then what stops it from just switching on all the experts? How do they keep the compute at about k experts per token?"
rubric = "About ReMoE (the paper under discussion), not Expert Choice's capacity or the bias method. Must state: ReMoE adds an L1 regularisation of the ReLU router outputs to the LM loss with an ADAPTIVE coefficient lambda_i, updated multiplicatively lambda_{i+1} = lambda_i * alpha^sign(target - S_i) toward a target sparsity 1 - k/E (lambda_0 = 1e-8, alpha = 1.2), so the average sparsity stays near the target and on average k experts are active, matching TopK's FLOPs. May add the load-balancing-refined L1 (weights f_{l,e}) and the three-stage training. Cited from ReMoE chunks."
turns = [
  { user = "How does ReMoE's routing differ from the usual TopK router?", assistant = "ReMoE replaces the Softmax + TopK router with a ReLU on the router logits, R(x) = ReLU(xW). TopK has a jump discontinuity at the k-th largest value; ReLU puts every breakpoint at 0, so the router is continuous and the whole training pipeline is fully differentiable [chunk:83677]. Because each expert's gate is decided independently, a token can go to a variable number of experts instead of exactly k, so harder tokens can get more compute [chunk:83678]." },
]

[[cases]]
id = "s1-03-vla-second-one"
scenario = 1
paperset = "vla2"
prompt = "What did the second one actually pretrain on, and how big was that pretraining run?"
rubric = "'The second one' is X-VLA. Must answer about X-VLA, not GR00T N1: data = a weighted mixture of AGIBOT, Droid and the RoboMind sources with cross-domain / cross-trajectory shuffling; run = X-VLA-0.9B on 64 A100 GPUs, global batch 1024, about 4 days, 200K iterations. Welcome (not required): the per-source numbers (AGIBOT 141K trajectories / weight 0.4, Droid 45K, RoboMind-Franka 19K, -Dual-Franka 2K, -UR 25K, -Agilex 11K), AdamW lr 1e-4 / betas 0.9/0.95 / wd 0.01, bf16, 224x224 images. Any number given must be correct. Cited from X-VLA chunks (pretraining details)."
turns = [
  { user = "How do GR00T N1 and X-VLA each deal with robots that have different bodies?", assistant = "GR00T N1 keeps one shared backbone (the Eagle-2 VLM plus a DiT flow-matching action module) and handles embodiment differences at the edges: an MLP per embodiment projects that robot's state and action vectors into a shared embedding size before the DiT [chunk:82439]. X-VLA absorbs the heterogeneity with soft prompts instead: a learnable embedding per data source, randomly initialised and learned end to end, injected early into action generation [chunk:82290]. Its pretraining mixture covers seven hardware setups across five robots from AGIBOT-beta, RoboMind and Droid [chunk:82289]." },
]

# ---------------------------------------------------------------------------
# Scenario 2 — cross-paper comparison with every cell cited
# ---------------------------------------------------------------------------

[[cases]]
id = "s2-01-moe-balance-table"
scenario = 2
paperset = "moe3"
prompt = "Make a comparison table of Expert Choice routing, the auxiliary-loss-free balancing strategy and ReMoE. Columns: routing rule, how load balance is achieved, whether an auxiliary/regularisation loss is used, and one known drawback. Cite every cell."
rubric = "Three rows, four columns, a citation in every cell, each from the right paper (except the attributed critique allowed in the Expert Choice drawback cell below). Expert Choice: each expert picks its top-k tokens, k = n*c/e (capacity factor c); balanced by design; no auxiliary loss; drawback: the Expert Choice paper does not state its own limitations, so either the cell cites the aux-loss-free paper AND the answer attributes the point (conditions on future tokens / breaks causality) as THAT paper's critique of Expert Choice, or the answer honestly reports that Expert Choice states no drawback; a critique cited to the EC paper, or presented as EC's own admission, is misattributed. Aux-loss-free: top-K over gating score + per-expert bias b_i (bias only for selection, not in the gate weight); bias updated b_i += u*sign(e_i) from the previous batch's load; no auxiliary loss; drawback stated only if supported (else marked not reported). ReMoE: ReLU router; adaptive L1 regularisation keeps sparsity at 1-k/E and a load-balancing-refined L1 (f_{l,e} weights, same form as the Switch LB loss) balances load — so it DOES use a regularisation loss; drawback e.g. extra compute/memory in the early dense stages. Uncited or misattributed cells fail grounding."

[[cases]]
id = "s2-02-jepa-table"
scenario = 2
paperset = "jepa"
prompt = "Now put it next to V-JEPA in a table: input modality, what is predicted and in which space, masking strategy, and pretraining data. Cite each cell."
rubric = "'It' is I-JEPA (the model under discussion), so the table compares I-JEPA with V-JEPA. I-JEPA: images; predicts representations of target blocks (from an EMA target encoder) in representation space, not pixels; multi-block masking: 4 target blocks with scale 0.15-0.2 and aspect ratio 0.75-1.5, one context block with scale 0.85-1.0 minus overlaps; pretraining on ImageNet(-1K). V-JEPA: video; predicts features/representations of masked regions in latent space; multi-block masking with short-range (8 blocks, 15% of each frame) and long-range (2 blocks, 70%) masks repeated across the time axis, ~90% average masking ratio; VideoMix2M (~2M videos from HowTo100M, Kinetics-400/600/700, SSv2). Every cell cited from the matching paper; an unsupported cell must say not found rather than guess."
turns = [
  { user = "What exactly does I-JEPA predict, and in which space?", assistant = "I-JEPA predicts the representations of several target blocks of an image from a single context block. The targets are outputs of a target encoder (updated as an exponential moving average of the context encoder), so the prediction is made in representation space rather than pixel space [chunk:82575]. It samples 4 target blocks with random scale 0.15-0.2 and aspect ratio 0.75-1.5 [chunk:82576]." },
]

[[cases]]
id = "s2-03-transformer-mamba"
papers = ["arxiv:1706.03762", "arxiv:2312.00752"]
scenario = 2
prompt = "Put Attention Is All You Need and Mamba side by side: cost per layer as sequence length grows, cost per generated token at inference, which data modalities each paper evaluates on, and the longest context they report working. Cite every cell."
rubric = "Transformer: self-attention O(n^2 * d) per layer, O(1) sequential ops; evaluated on WMT14 translation (En-De, En-Fr) and English constituency parsing; no long-context claim (say not reported if absent). Mamba: linear in sequence length in training, constant time per step at inference (no cache of previous elements); language, DNA (HG38 genomics) and audio; performance improves with context up to million-length sequences. Every cell cited from the right paper; 'not reported' is acceptable where the paper is silent, invention is not."

