[[cases]]
id = "s3-01-genomics-evidence"
papers = ["arxiv:2312.00752", "arxiv:1706.03762"]
scenario = 3
prompt = "For my related-work section: did either of these papers run experiments on DNA or genomics data? If yes, which dataset and which tasks exactly?"
rubric = "Mamba: yes — DNA pretraining on the HG38 human genome (~4.5B base-pair tokens, following HyenaDNA), scaling with model size and with sequence length (up to ~1M), and Great Apes DNA classification fine-tuning (5 species). Attention Is All You Need: NO genomics experiments — must say so plainly (it covers translation and constituency parsing). Inventing DNA results for the Transformer paper fails. Mamba facts cited."

[[cases]]
id = "s3-02-mt-evidence"
papers = ["arxiv:1810.04805", "arxiv:2005.14165"]
scenario = 3
prompt = "Did BERT or GPT-3 evaluate on machine translation? I need the benchmarks and numbers, if any."
rubric = "GPT-3: yes — WMT'14 Fr<->En, WMT'16 De<->En and WMT'16 Ro<->En, BLEU (multi-bleu with XLM tokenisation); few-shot GPT-3 beats prior unsupervised NMT by about 5 BLEU when translating INTO English; specific numbers only if quoted from cited chunks. BERT: NO machine-translation evaluation (MT appears only in related work / discussion) — must say so plainly. Fabricated BERT BLEU fails."

[[cases]]
id = "s3-03-yoloseg-speed"
paperset = "yoloseg"
scenario = 3
prompt = "Our inspection line needs about 20 images per second, so for that model: does the paper report inference speed (FPS or ms per image) or the hardware it ran on?"
rubric = "Honest negative: the paper reports NO FPS / latency and no inference or training hardware. What it does report and may be cited: parameter counts (YOLOSeg 7.15M; DDPM 7M used only for augmentation; YOLOv5s-seg 7.6M; Mask R-CNN 44M), input size 608x608, and only a qualitative remark that YOLOv5s-segmentation suits speed-prioritised tasks. Should say speed would have to be measured. Any invented FPS/ms number fails. ('That model' is YOLOSeg, the model under discussion; the seeded turn gave only architecture and parameter count, so it supplies no speed figure.)"
turns = [
  { user = "What does YOLOSeg build on, and how big is the model?", assistant = "YOLOSeg uses the YOLOv5s detector from the YOLOv5 family as its base detection model [chunk:82414], and adds a UNet-like structure to the segmentation head. The YOLOSeg network itself has 7.15 million parameters [chunk:82424]." },
]

# ---------------------------------------------------------------------------
# Scenario 4 — idea -> experiment plan (H4-only in G-b)
# ---------------------------------------------------------------------------

[[cases]]
id = "s4-01-remoe-bias-plan"
papers = ["arxiv:2412.14711", "arxiv:2408.15664"]
scenario = 4
prompt = "Let's test it. Write me an experiment plan."
rubric = "A concrete plan for ReMoE + auxiliary-loss-free bias balancing, grounded in both papers: Must: the variant (a per-expert bias that shifts each expert's ReLU gate / threshold, updated by u*sign(load error) from the previous batch, adaptive L1 kept for sparsity only); baselines (ReMoE with its load-balancing L1, TopK MoE); a setup matched to ReMoE (same model family and training corpus); metrics (validation loss/perplexity, a load-balance measure such as MaxVio from the aux-free paper, sparsity vs target); at least one ablation (e.g. bias rate u). Welcome (cited when given, not required): extra baselines (ReMoE with plain L1, TopK with the 0.01 LB loss); ReMoE's setup numbers (The Pile, 60k steps ~30B tokens, context 1024, batch 512, AdamW lr 5e-4 cosine, 182M/469M/978M backbones); downstream eval; lambda_0/alpha ablations. Facts from the papers cited; the plan's own choices must not be presented as paper results. Generic experiment advice without the two papers' specifics fails."
turns = [
  { user = "Could ReMoE use the auxiliary-loss-free bias balancing instead of its load-balancing L1 term?", assistant = "Plausibly, with one catch. ReMoE folds load balancing into its L1 regulariser by weighting each router output with the expert's activation ratio f_{l,e}; that has the same form as the Switch load-balancing loss, and because ReLU outputs can shrink to 0 it needs the adaptive lambda_i to avoid collapse [chunk:83681]. The auxiliary-loss-free method instead adds a per-expert bias b_i to the gating scores only for the top-K selection and nudges it by u*sign(load error) after each batch, so no balancing gradient touches the training objective [chunk:83602, 83603]. ReMoE has no top-K to bias, so the bias would have to shift each expert's ReLU threshold instead." },
]

[[cases]]
id = "s4-02-ddpm-livecell-plan"
papers = [
  "sha256:b973a48f4b473829bb30671bec295b5682f1ec9509748ad02576eb16a5c1a6f4",
  "sha256:ade2a8b1d411f0fd0f98e33e582591df4ac9e62f37abadd823858a8071a2f8b4",
]
scenario = 4
prompt = "Turn this into an experiment plan I can actually run."
rubric = "A plan for DDPM pseudo-cell augmentation on LIVECell, grounded in both papers: Must: data from LIVECell (target SH-SY5Y, the hardest cell type at 22-28% AP; its own splits/benchmarks); a baseline (LIVECell's anchor-based / anchor-free models); the augmentation done the YOLOSeg way (DDPM on cut-out object patches, auto-annotation, paste onto images, a sweep of the augmentation amount); metric = AP as LIVECell reports it; a no-augmentation control; at least one stated risk (e.g. dense/touching cells, phase-contrast appearance). Welcome (cited when given, not required): LIVECell totals (5,239 images, 1,686,352 cells, 8 cell types); fine-tuning from MS-COCO weights; 64x64 DDPM input, Otsu, sweep 1x to 2x with 1.25x as YOLOSeg's best; copy-paste of real cells as a control. Paper facts cited; generic plans fail."
turns = [
  { user = "Idea: YOLOSeg's DDPM defect augmentation might help LIVECell's hardest cell type. Does that make sense?", assistant = "It could. YOLOSeg trains a DDPM only on the defect patches cut out along their annotated contours, generates pseudo defects, auto-annotates them with Otsu binarisation and pastes them onto defect-free images [chunk:82418, 82426]. Augmenting the training set to 1.25x worked best, and DDPM raised IoU from 0.715 to 0.754 in their ablation [chunk:82426, 82423]. On LIVECell, SH-SY5Y is by far the hardest type, with detection and segmentation AP of 22-28% versus 64-66% for SkBr3 [chunk:82354]. The catch is that LIVECell cells are dense and touching, so pasted cells need realistic neighbours rather than an empty background." },
]

[[cases]]
id = "s4-03-lora-xvla-plan"
papers = ["arxiv:2510.10274", "arxiv:2106.09685"]
scenario = 4
prompt = "Draft the experiment plan: which arms to compare, the training settings for each (steps, batch size, what LoRA touches), the benchmarks to run, and what result would tell us the soft prompt is still needed."
rubric = "A plan grounded in both papers: Must: arms (a) LoRA without training a new soft prompt and (b) LoRA + a new soft prompt (X-VLA's own PEFT setup: ~9M tunable params, ~1%), optionally (c) X-VLA's full two-step adaptation; training settings grounded in X-VLA's finetuning table (batch size, number of steps for PEFT) and LoRA's design (frozen W0, low-rank BA with B=0 init, rank r, which weight matrices); evaluation on benchmarks X-VLA reports for PEFT; a stated decision rule (e.g. arm (a) clearly below (b) => prompt needed). Welcome (cited when given, not required): batch 128 / 40K steps, Abs EEF, AdamW 1e-4, betas 0.9/0.95, bf16; alpha/r scaling; the specific benchmarks (LIBERO suites, Simpler-WidowX, an unseen real embodiment like the AIRBOT cloth pick); the 1,000-iteration prompts+heads-only step before warm-up. Should acknowledge X-VLA already reports LoRA PEFT results. Cited; generic advice fails."
turns = [
