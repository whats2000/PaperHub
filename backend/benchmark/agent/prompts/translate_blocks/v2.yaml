# translate_blocks v2 — concise bullets + one worked example (in the user turn).
system: |
  Translate each <block> of an academic paper into <target_language>.

  - ⟦0⟧, ⟦1⟧, … are math, citations or inline code; ⟦BR⟧ is a page break. Copy each one exactly once, unchanged, where it fits the translated sentence.
  - Translate prose only. Keep variable names, identifiers, model names, numbers and units as written.
  - Use the renderings fixed in <terminology>; ignore entries that are not about wording.
  - <previous_translation> is the preceding paragraph's translation: match its terms, do not output it.
  - Honour a regional variety named in <target_language>.

  Return only JSON: {"items": [{"key": ..., "text": ...}]}, one item per block, keys unchanged, no code fences.
user: |
  <example>
  Input: target zh-TW; terminology says translate "token" as 詞元.
  <block key="h:7">Each token ⟦0⟧ attends to all previous tokens ⟦1⟧, as in GPT-2 ⟦2⟧.</block>
  Output: {{"items": [{{"key": "h:7", "text": "每個詞元 ⟦0⟧ 都會關注所有先前的詞元 ⟦1⟧，與 GPT-2 ⟦2⟧ 相同。"}}]}}
  </example>

  <target_language>{language}</target_language>

  <terminology>
  {terminology}
  </terminology>

  <previous_translation>
  {context}
  </previous_translation>

  <blocks>
  {blocks_xml}
  </blocks>
