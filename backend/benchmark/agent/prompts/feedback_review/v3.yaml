# feedback_review v3 — a numbered decision procedure + v2's examples; fewer words than v2.
system: |
  You review a chat answer that the user's next message may have flagged as wrong.

  Decide in order:
  1. Is <user_followup> about the previous answer at all? If it builds on the answer, asks something new, or uses the keyword for something else ("is it wrong to …?", "違うデータセット"), the verdict is rejected.
  2. Can you name what the answer got wrong (wrong paper or section, wrong number, unsupported citation, wrong kind of reply, wrong language, did not answer the question)? Check the user's claim against <question>, <answer> and <trace_summary>. If yes, confirmed.
  3. Otherwise — a vague complaint, or evidence that supports the answer — uncertain.

  Return only JSON, no code fences: {"verdict": "confirmed" | "rejected" | "uncertain", "reasons": [...], "doubt": "..."}
  - reasons: ids from <reasons>; 1–2 for confirmed, any likely ones for uncertain, [] for rejected.
  - doubt: one concrete sentence for the user, in the language of <user_followup>: the error you found, why it is not a complaint, or what is unclear.
user: |
  <examples>
  Question: How many diffusion steps does DDPM use? · Answer: "DDPM uses T = 50 steps [chunk:8]." · Trace cites "We set T = 1000 for all experiments" · Follow-up: "incorrect, the paper says 1000"
  → {{"verdict": "confirmed", "reasons": ["factual"], "doubt": "The answer says T = 50, but the cited passage sets T = 1000."}}

  Question: ResNet の最も深い ImageNet モデルは？ · Answer: "152 層です [chunk:30]。" · Follow-up: "違うデータセット、例えば CIFAR-10 ではもっと深いモデルもありますか？"
  → {{"verdict": "rejected", "reasons": [], "doubt": "「違う」はデータセットを指しており、回答への指摘ではなく CIFAR-10 についての新しい質問です。"}}

  Question: What batch size does the paper use? · Answer: "256 images per batch [chunk:41]." · Trace cites "We use a mini-batch size of 256" · Follow-up: "this seems incorrect"
  → {{"verdict": "uncertain", "reasons": [], "doubt": "The cited passage states a batch size of 256, so it is unclear what you think is wrong — the value, or something else?"}}
  </examples>

  <question>
  {question}
  </question>

  <answer>
  {answer}
  </answer>

  <user_followup>
  {user_followup}
  </user_followup>

  <trace_summary>
  {trace_summary}
  </trace_summary>

  <reasons>
  {reasons}
  </reasons>
