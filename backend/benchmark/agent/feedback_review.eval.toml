# Per-agent eval sweep config (SRS §III-9) for the H2 reviewer prompt.
# Deterministic grade = verdict accuracy vs the labelled corpus; the `doubt`
# sentence is judged afterwards with the `pairwise` command.
[eval]
stage       = "feedback_review"
model       = "gemini/gemini-3.8-flash"   # deploy reviewer tier: PAPERHUB_FEEDBACK_REVIEW_MODEL defaults to the flagship (Round 4)
reps        = 5
backend     = "auto"
store       = "benchmark/agent/results/experiments.jsonl"
prompts_dir = "benchmark/agent/prompts"
variants    = ["v21"]   # v21 = shipped feedback_review/v3; all rounds in prompts/feedback_review/README.md
concurrency = 4

[[testsets]]
name   = "core"
corpus = "benchmark/agent/corpus/feedback_review.core.jsonl"

