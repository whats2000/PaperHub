# Per-agent eval sweep config (SRS §III-9): variants × test-set buckets.
# Add a variant: write benchmark/agent/prompts/router/v2.yaml, then append "v2".
# Add a bucket: add a [[testsets]] block (e.g. the harvested production failures).
[eval]
stage       = "router"
model       = "gemini/gemini-3.5-flash-lite"   # deploy router = small tier (PAPERHUB_MODEL_SMALL); PAPERHUB_ROUTER_MODEL unset
reps        = 5                       # >=5 reps: router multi-intent tie-breaks are subtle (writing-agent-prompts)
backend     = "auto"                  # provider Batch API where available, else concurrent
store       = "benchmark/agent/results/experiments.jsonl"
prompts_dir = "benchmark/agent/prompts"
# judge_model is only used for stages WITHOUT a deterministic score; the router
# is graded by exact intent match, so it is omitted.
# v2a = current verified winner (Plan G1). v3 (Plan G2) = v2a with model_tier
# dropped + an explicit multi-intent priority rule. v3 is benchmarked AGAINST
# v2a (the baseline), not v1.
variants    = ["v8b", "v9c", "v9e"]   # v8b = router/v5 (baseline); v9e shipped as router/v6 (a follow-up restates the discussed subject); see prompts/router/README.md
concurrency = 4

[[testsets]]
name   = "core"
corpus = "benchmark/agent/corpus/router.core.jsonl"

[[testsets]]
name   = "regression"
corpus = "benchmark/agent/corpus/router.regression.jsonl"

[[testsets]]
name   = "edge"
corpus = "benchmark/agent/corpus/router.edge.jsonl"

# Plan G2: compound messages that carry >1 intent. v3's priority rule should
# resolve these deterministically; v2a (no rule) is expected to be inconsistent.
[[testsets]]
name   = "multiintent"
corpus = "benchmark/agent/corpus/router.multiintent.jsonl"

# Chat-history counts ("how many questions have I asked") -> library_stats, in
# en / zh-TW / zh-CN / ja, plus chitchat guards so "what can you do?" stays put.
[[testsets]]
name   = "history"
corpus = "benchmark/agent/corpus/router.history.jsonl"

# A bare pointer ("this paper", "這篇", "この論文") with 0 refs -> clarify, plus
# guards: a named title (also next to a pointer, or named in an earlier turn)
# -> paper_search, a pointer plus a topic -> paper_suggest. Live run 837.
[[testsets]]
name   = "deictic"
corpus = "benchmark/agent/corpus/router.deictic.jsonl"

# A follow-up's resolved_query must restate the discussed subject (the paper
# readers see only resolved_query), graded by expect.query_has / query_lacks;
# guards: a self-contained question, a topic switch and other intents keep
# their rewrite free of the old subject. Live run 892.
[[testsets]]
name   = "followup"
corpus = "benchmark/agent/corpus/router.followup.jsonl"
